name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly full-history reminder until #59 history rewrite is done
    - cron: "15 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Scans the working tree only (no git history). Must stay green on tip.
  scan-workdir:
    name: Workdir (tip) — gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan working tree (fail on findings; no allowlist of real secrets)
        run: |
          gitleaks detect \
            --no-git \
            --source . \
            --redact \
            --verbose \
            --exit-code 1

  # Full git history. Expected RED until history is rewritten (BFG / git-filter-repo).
  # Do NOT add .gitleaksignore entries for legitimate historical exposures just to go green.
  scan-history:
    name: Git history — gitleaks (expected fail until rewrite)
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan git history (fail on findings; no secret allowlist)
        run: |
          gitleaks detect \
            --source . \
            --redact \
            --verbose \
            --exit-code 1
