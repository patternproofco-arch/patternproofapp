name: Release gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      - name: Unit and integration tests
        run: bunx vitest run

      - name: Production build
        run: bun run build

      - name: SEO checks
        run: bun run seo:check

      - name: Public browser checks
        run: bunx playwright install --with-deps chromium && bun run test:e2e
