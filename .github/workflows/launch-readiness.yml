name: Launch Readiness

on:
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --reporter=dot

      - name: Run database isolation and consent tests
        run: npm run test:security:sql

      - name: Run TypeScript
        run: npx tsc --noEmit

      - name: Build production bundle
        # The host wrapper loads .env itself; isolate the entire CI build from
        # production, rather than relying on Vite define overrides alone.
        env:
          VITE_SUPABASE_URL: https://example.invalid
          VITE_SUPABASE_PROJECT_ID: ci-placeholder
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-not-a-secret
        run: NODE_OPTIONS=--max-old-space-size=4096 npm run build

      - name: Record source provenance
        run: node scripts/source-digest.mjs

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run Playwright suite against production build
        env:
          E2E_PREVIEW: "1"
        run: npm run test:e2e

      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: launch-browser-failure
          path: |
            test-results/
            ~/.config/.wrangler/logs/
          retention-days: 7
          if-no-files-found: ignore
